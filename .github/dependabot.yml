version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      composer-minor:
        update-types: [minor, patch]
      livewire:
        patterns: ['livewire/*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Vite+ pins its own Vite core through `overrides`; bump them together.
      - dependency-name: vite
      - dependency-name: vite-plus

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ['*']
